# Encoder-only masked auto-encoder, FLOP-matched to tuned_hrm: 88.09M params (7.00x), 14.83 GFLOP/fwd (1.00x).
#
# Extended-budget arm: 10 passes over full Sudoku-Extreme, deliberately BREAKING the matched step
# count of the other four configs. Those held the budget fixed to isolate unique-puzzle count; this
# one asks the separate question of whether the FLOP-matched MAE is simply undertrained, since its
# 1-epoch curve was still drifting up at the end (0.0116 mean over 3 seeds).
#   matched arm: 3.83M puzzles x 1 epoch  =  79,824 steps, 1 augmented variant per puzzle
#   this arm:    3.83M puzzles x 10 epochs= 798,240 steps, 10 augmented variants per puzzle
# Note both quantities move together: 10 epochs buys 10x the steps AND 10x the augmentation
# variety, so a gain here does not separate the two. `lr_min_ratio: 1.0` keeps the LR constant
# after warmup, so the 10x longer schedule does not change the learning rate at any given step.
# `eval_interval: 4160` is kept from the matched arm, so the first 79,824 steps of this run should
# overlay that run's curve - a free sanity check - at the cost of 191 evaluations.
defaults:
  - data: sudoku_full
  - _self_

run_name: mae_flops_matched_full_10ep

arch:
  name: mae@MaskedAutoEncoder

  # Transformer
  num_layers: 28  # = the 28 block-forwards HRM unrolls per forward pass

  hidden_size: 512
  intermediate_size: 2048
  head_dim: 64

  norm_eps: 1e-6
  rope_theta: 10000.0

  forward_dtype: bfloat16

seeds: [1]

cycles_per_data: 16
epochs: 10
eval_interval: 4160

# Full Sudoku-Extreme splits are named train/test and there is no `test_hard`. Evaluate on the
# 1k repo's 20k test_hard split instead, i.e. the exact same puzzles the 1k runs were scored on,
# so the two settings are directly comparable. Verified: all 20,000 are a subset of the full
# `test` split and none appear in the 3,831,994-row full train split.
eval_dataset_name: ./downloaded-datasets/sudoku-extreme-1k
eval_splits: [test_hard]
best_metric_split: test_hard

local_batch_size: 96

lr: 1e-4
lr_warmup_steps: 2000
lr_min_ratio: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 1.0
ema: 0.999
