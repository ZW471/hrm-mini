# `mae_ds_shared_matched` + INPUT INJECTION: the embedded puzzle is re-added to the hidden state at
# every supervision point, so each segment refines a scratchpad while seeing the puzzle again --
# `rt@RecurrentTransformer`'s `z = core(z + x)` -- instead of having to carry the puzzle through all
# 28 tied blocks. Addition is free, so this is still 12.59M params (1.00x) and 14.83 GFLOP/fwd
# (1.00x), matched to tuned_hrm on both axes.
#
# It is still one forward pass per sample (`cycles_per_data: 1`): no state is carried between
# supervision steps, and eval runs a single pass, unlike HRM/RT's 16 refinement rounds.
#
# The other MAE baselines have to pick one: `mae_ds_param_matched` buys the parameter count with 4
# layers (0.14x FLOPs), `mae_ds_flops_matched` buys the compute with 28 layers (7.00x params).
# Here the 28 block-forwards are produced by applying the *same* stack of 4 blocks 7 times, so
# depth costs compute but no parameters -- exactly how HRM reuses its 2 H-level + 2 L-level blocks
# across cycles. This isolates deep supervision + recurrent depth from extra capacity.
defaults:
  - data: sudoku
  - _self_

run_name: mae_ds_shared_inject_matched

arch:
  name: mae_ds_shared@SharedDeeplySupervisedMaskedAutoEncoder

  # Transformer: 4 distinct blocks (= HRM's 2 H-level + 2 L-level layers), shared by all 28
  # block-forwards of a pass. num_layers * num_unrolls = 4 * 7 = 28, the block-forward count HRM
  # unrolls per forward pass.
  num_layers: 4
  num_unrolls: 7

  hidden_size: 512
  intermediate_size: 2048
  head_dim: 64

  norm_eps: 1e-6
  rope_theta: 10000.0

  # Deep supervision: read out once per complete pass through the shared stack, i.e. 28 / 4 = 7
  # supervision points, the last of which is the final block-forward. This mirrors HRM supervising
  # after each cycle. `detach_segments` mirrors HRM's detached carry -- no gradient crosses a
  # readout; because the blocks are shared, every segment still contributes gradient to every
  # block. Set `layers_per_segment: 7` for 4 readouts (as in mae_ds_flops_matched), or
  # `detach_segments: False` to backprop through the whole unrolled pass.
  layers_per_segment: 4
  detach_segments: True

  # Re-present the embedded input at every supervision point (the one change vs mae_ds_shared_matched)
  inject_input: True

  forward_dtype: bfloat16

# HRM takes `cycles_per_data` (16) gradient steps per batch via deep supervision. These models are
# feed-forward, so they take one step per batch and instead see each sample 16x more often
# (repeat 200 -> 3200). Optimizer steps, samples seen and eval frequency all match tuned_hrm.
data:
  repeat: 3200

seeds: [1, 2, 3]

cycles_per_data: 1
epochs: 20

local_batch_size: 96

lr: 1e-4
lr_warmup_steps: 2000
lr_min_ratio: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 1.0
ema: 0.999
