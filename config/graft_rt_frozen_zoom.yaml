# config/graft_rt_frozen at 16x finer eval, for the first 2 epochs only.
#
# The 20-epoch run's first eval lands at step 4,160 and is already 6.6 points *below* the frozen
# checkpoint the graft starts from (70.87% -> 64.23%), so the whole question of whether the graft
# ever helps lives inside that first epoch. Post-warmup LR is constant (lr_min_ratio: 1.0) and
# warmup is step-based, so steps 1..8,320 here are identical to the same steps of the 20-epoch
# run -- this is a zoom-in on that run, not a different one.
defaults:
  - /graft_rt_frozen@_here_
  - _self_

run_name: graft_rt_frozen_zoom
epochs: 2
eval_interval: 260
