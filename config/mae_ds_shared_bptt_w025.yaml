# `mae_ds_shared_carry_bptt_matched` with the deep-supervision loss REWEIGHTED: a quarter of the loss
# sits on the final readout (0.25), the rest spread evenly over the 6 earlier ones. The model and its
# state trajectory are unchanged -- only the loss differs. The default (equal weight over all 7
# readouts) is w = 1/7 = 0.143; w = 1.0 supervises only the final readout, which makes this model
# numerically identical to `rt@RecurrentTransformer` (verified: same logits, same carry).
#
# This sweeps the one remaining difference between the DS ladder and tuned_rt.
defaults:
  - data: sudoku
  - _self_

run_name: mae_ds_shared_bptt_w025

arch:
  name: mae_ds_shared@SharedDeeplySupervisedMaskedAutoEncoder

  # Transformer: 4 distinct blocks (= HRM's 2 H-level + 2 L-level layers), shared by all 28
  # block-forwards of a pass. num_layers * num_unrolls = 4 * 7 = 28, the block-forward count HRM
  # unrolls per forward pass.
  num_layers: 4
  num_unrolls: 7

  hidden_size: 512
  intermediate_size: 2048
  head_dim: 64

  norm_eps: 1e-6
  rope_theta: 10000.0

  # Deep supervision: read out once per complete pass through the shared stack, i.e. 28 / 4 = 7
  # supervision points, the last of which is the final block-forward.
  layers_per_segment: 4
  detach_segments: False

  # Re-present the embedded input at every supervision point
  inject_input: True
  # Carry the final hidden state across the `cycles_per_data` supervision steps (and eval rounds)
  use_carry: True

  forward_dtype: bfloat16

# Like tuned_hrm/tuned_rt: 16 gradient steps per batch over a carried state, so `repeat` goes back
# to 200. Optimizer steps, samples seen and eval frequency still match tuned_hrm.
data:
  repeat: 200

seeds: [1, 2, 3]

final_readout_weight: 0.25

cycles_per_data: 16
epochs: 20

local_batch_size: 96

lr: 1e-4
lr_warmup_steps: 2000
lr_min_ratio: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 1.0
ema: 0.999
