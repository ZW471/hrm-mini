# Decoder-only autoregressive transformer, PARAMETER-matched to tuned_hrm: 12.59M params (1.00x), 4.24 GFLOP/fwd (0.29x).
defaults:
  - data: sudoku
  - _self_

run_name: ar_param_matched

arch:
  name: ar_transformer@AutoregressiveTransformer

  # Transformer
  num_layers: 4  # = HRM's 2 H-level + 2 L-level layers

  hidden_size: 512
  intermediate_size: 2048
  head_dim: 64

  norm_eps: 1e-6
  rope_theta: 10000.0

  forward_dtype: bfloat16

# HRM takes `cycles_per_data` (16) gradient steps per batch via deep supervision. These models are
# feed-forward, so they take one step per batch and instead see each sample 16x more often
# (repeat 200 -> 3200). Optimizer steps, samples seen and eval frequency all match tuned_hrm.
data:
  repeat: 3200

seeds: [1, 2, 3]

cycles_per_data: 1
epochs: 20

local_batch_size: 96

lr: 1e-4
lr_warmup_steps: 2000
lr_min_ratio: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 1.0
ema: 0.999
