# Decoder-only autoregressive transformer, PARAMETER-matched to tuned_hrm: 12.59M params (1.00x), 4.24 GFLOP/fwd (0.29x).
defaults:
  - data: sudoku
  - _self_

run_name: ar_param_matched

arch:
  name: ar_transformer@AutoregressiveTransformer

  # Transformer
  num_layers: 4  # = HRM's 2 H-level + 2 L-level layers

  hidden_size: 512
  intermediate_size: 2048
  head_dim: 64

  norm_eps: 1e-6
  rope_theta: 10000.0

  forward_dtype: bfloat16

# Data pipeline is left exactly as tuned_hrm's: `repeat: 200` from config/data/sudoku.yaml, and
# `cycles_per_data: 16` gradient steps per batch. Sudoku augmentation is sampled on the fly per
# batch, so `repeat` sets how many distinct augmentations of each puzzle the model ever sees;
# raising it to trade deep-supervision steps for fresh data would give the baseline 16x HRM's
# augmented training set and make the comparison a data-scale one. The carry is empty for these
# feed-forward models, so the 16 cycles are simply 16 optimizer steps on the same augmented batch.
# Optimizer steps, augmentations seen and eval frequency all match tuned_hrm.

seeds: [1, 2, 3]

cycles_per_data: 16
epochs: 20

local_batch_size: 96

lr: 1e-4
lr_warmup_steps: 2000
lr_min_ratio: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 1.0
ema: 0.999
