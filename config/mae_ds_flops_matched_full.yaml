# Deeply supervised encoder-only masked auto-encoder, FLOP-matched to tuned_hrm:
# 88.09M params (7.00x), 14.83 GFLOP/fwd (1.00x). Identical to mae_flops_matched_full except that
# the lm_head is also read out (and supervised) every 7 layers, not just after the last one.
#
# Full Sudoku-Extreme instead of the 1k subsample, holding the training budget fixed so the only
# variable is the number of *unique* puzzles. This config is to mae_flops_matched_full exactly what
# mae_ds_flops_matched is to mae_flops_matched: the model is feed-forward, so it takes one gradient
# step per batch instead of 16 and sees each puzzle 16x more often (repeat 1 -> 16) to land on the
# same step count.
#   mae_flops_matched_full:  3.83M x repeat 1  = 4,989 batches x 16 cycles = ~79.8k steps
#   this config:             3.83M x repeat 16 = 79,833 batches x 1 cycle  = ~79.8k steps
# Augmentation is sampled per batch, so the 16 repeats are 16 distinct augmentations of each
# puzzle. Optimizer steps, augmented samples seen and eval cadence all match.
defaults:
  - data: sudoku_full
  - _self_

run_name: mae_ds_flops_matched_full

arch:
  name: mae_deep_supervision@DeeplySupervisedMaskedAutoEncoder

  # Transformer
  num_layers: 28  # = the 28 block-forwards HRM unrolls per forward pass

  hidden_size: 512
  intermediate_size: 2048
  head_dim: 64

  norm_eps: 1e-6
  rope_theta: 10000.0

  # Deep supervision: 28 / 7 = 4 supervision points, the last of which is the final layer.
  # `detach_segments` mirrors HRM's detached carry -- each block is trained only by the readout
  # right after it. Set it to False to also let the later readouts backprop through earlier blocks.
  layers_per_segment: 7
  detach_segments: True

  forward_dtype: bfloat16

data:
  repeat: 16

seeds: [1, 2, 3]

cycles_per_data: 1
epochs: 1
eval_interval: 4160

# Full Sudoku-Extreme splits are named train/test and there is no `test_hard`. Evaluate on the
# 1k repo's 20k test_hard split instead, i.e. the exact same puzzles the 1k runs were scored on,
# so the two settings are directly comparable.
eval_dataset_name: ./downloaded-datasets/sudoku-extreme-1k
eval_splits: [test_hard]
best_metric_split: test_hard

local_batch_size: 96

lr: 1e-4
lr_warmup_steps: 2000
lr_min_ratio: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 1.0
ema: 0.999
